name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and iOS project scaffolding
        run: flutter create --platforms=android,ios --org com.csprofesor .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
