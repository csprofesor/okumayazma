name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - name: Build Android APK
        run: |
          if ! flutter build apk --debug --android-skip-build-dependency-validation; then
            ERR=$(flutter build apk --debug --verbose 2>&1 | grep -A 15 -E '(FAILURE: Build failed|\* What went wrong:)' | head -n 20 | tr '\r\n' ' ')
            echo "::error title=APK Build Error::$ERR"
            exit 1
          fi
